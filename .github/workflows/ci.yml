name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: imresamu/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: looters
          POSTGRES_PASSWORD: looters
          POSTGRES_DB: looters_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U looters -d looters_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:4.1.0
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        ports: ["9092:9092"]
    env:
      # The integration tests are skipped without these: here they must run.
      TEST_DATABASE_URL: postgresql://looters:looters@localhost:5432/looters_test
      TEST_KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Create the schema the api owns
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f testdata/schema.sql
      # One package at a time: they share the test database.
      - run: go test -count=1 -p 1 ./...
      - run: go build ./...
